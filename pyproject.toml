[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perpetual-rv-demo"
version = "1.0.0"
description = "Synthetic research controls for crypto perpetual relative value"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jing Li"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

